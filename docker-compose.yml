version: "3.8"

services:
  gfb-lunch-order:
    image: ghcr.io/sebastiansucker/kantinen-kobold:latest
    build: .
    container_name: gfb-lunch-order
    restart: unless-stopped
    env_file:
      - .env
    volumes:
      - ./data:/data
      # Enthält echte Zugangsdaten pro Kind, siehe config.json.example -
      # bewusst nicht ins Image gebacken, sondern hier vom Host gemountet.
      - ./config.json:/app/config.json:ro
    # Zeitzone wichtig, damit der Cron-Job zur richtigen Uhrzeit läuft
    environment:
      - TZ=Europe/Berlin
